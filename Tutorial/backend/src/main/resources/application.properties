# ==========================================
# GameForge Arena - Secure Configuration
# ==========================================

# 1. Server Configuration
server.port=8080

# 2. Database Connection (PostgreSQL)
# Notice how we DO NOT write the real password here! 
# We use ${...} to pull the secrets from the computer's Environment Variables.
# This ensures passwords are never tracked in GitHub.
spring.datasource.url=jdbc:postgresql://localhost:5432/gameforge
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# 3. Security (Preventing Database errors from leaking to users)
server.error.include-message=never
server.error.include-stacktrace=never
